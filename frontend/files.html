<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Docholder — My Files Library</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
</head>
<body>
    <div class="mobile-app-shell">
        <div class="mobile-status-bar">
            <span class="status-bar-time">9:41</span>
            <div class="dynamic-island-notch">
                <div class="notch-camera-dot"></div>
            </div>
            <div class="status-bar-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <header class="mobile-app-header">
            <button class="mobile-header-btn" onclick="handleSmartBack('dashboard.html')"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="mobile-header-title">
                <span>My Files</span>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
                <a href="settings.html" class="mobile-header-btn" title="Settings"><i class="fa-solid fa-gear"></i></a>
                <button class="theme-toggle-btn" onclick="toggleTheme()" style="width: 32px; height: 32px; font-size: 0.85rem;" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
                <a href="upload.html" class="mobile-header-btn" title="Upload"><i class="fa-solid fa-plus"></i></a>
            </div>
        </header>

        <span id="nav-user-email" class="hidden"></span>

        <main class="app-body">
            <div class="page-title-block" style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h1 class="page-title"><i class="fa-solid fa-folder-open" style="color: var(--primary);"></i> Library</h1>
                    <p class="page-subtitle">Universal file manager & media viewer.</p>
                </div>
                <span id="files-total-count" class="badge badge-doc" style="margin-bottom: 4px;">0 files</span>
            </div>

            <!-- Search & Sort Bar -->
            <div class="glass-card" style="padding: 10px 12px; margin-bottom: 10px;">
                <div style="position: relative; margin-bottom: 8px;">
                    <i class="fa-solid fa-magnifying-glass" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 0.8rem;"></i>
                    <input type="text" id="search-input" class="form-input" placeholder="Search by filename..." style="padding-left: 32px; font-size: 0.82rem; height: 36px;">
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-size: 0.75rem; color: var(--text-secondary); font-weight: 600;">Sort By:</span>
                    <select id="sort-select" class="form-select" style="width: auto; padding: 4px 8px; font-size: 0.78rem; height: 30px;">
                        <option value="date">Newest</option>
                        <option value="name">Name (A-Z)</option>
                        <option value="size">Size</option>
                        <option value="type">Type</option>
                    </select>
                </div>
            </div>

            <!-- Filter Chips (Horizontally Scrollable) -->
            <div class="filter-chips">
                <button class="chip active" data-category="all">All</button>
                <button class="chip" data-category="favorites"><i class="fa-solid fa-star" style="color: #F59E0B;"></i> Starred</button>
                <button class="chip" data-category="recent"><i class="fa-solid fa-clock-rotate-left" style="color: var(--cyan-neon);"></i> Recent</button>
                <button class="chip" data-category="doc"><i class="fa-solid fa-file-word"></i> Docs</button>
                <button class="chip" data-category="image"><i class="fa-solid fa-file-image"></i> Images</button>
                <button class="chip" data-category="video"><i class="fa-solid fa-file-video"></i> Video</button>
                <button class="chip" data-category="audio"><i class="fa-solid fa-file-audio"></i> Audio</button>
                <button class="chip" data-category="archive"><i class="fa-solid fa-file-zipper"></i> Zip</button>
                <button class="chip" data-category="text"><i class="fa-solid fa-file-code"></i> Code</button>
            </div>

            <!-- Batch Action Bar -->
            <div id="batch-action-bar" class="glass-card" style="padding: 8px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
                <label style="display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer;">
                    <input type="checkbox" id="select-all-files-checkbox">
                    <span id="selected-files-count-label">0 selected</span>
                </label>
                <div style="display: flex; gap: 6px;">
                    <button id="btn-batch-download-zip" class="btn btn-primary btn-sm" style="padding: 4px 10px; font-size: 0.72rem;"><i class="fa-solid fa-file-zipper"></i> Download ZIP</button>
                    <button id="btn-batch-delete" class="btn btn-secondary btn-sm" style="padding: 4px 8px; font-size: 0.72rem; color: var(--danger);"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            </div>

            <!-- Files Table / List -->
            <div class="glass-card" style="padding: 12px;">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 24px;"></th>
                                <th>Name</th>
                                <th>Size</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="files-table-body">
                            <tr><td colspan="4" style="text-align: center; color: var(--text-secondary); padding: 24px;">Loading documents...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Universal Media Preview Modal -->
        <div id="preview-modal" class="modal-overlay hidden">
            <div class="modal-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h4 id="preview-title" style="margin: 0; font-size: 0.95rem; word-break: break-all;">Preview</h4>
                    <button id="close-preview-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="preview-body" style="max-height: 420px; overflow-y: auto;"></div>
            </div>
        </div>

        <!-- Raw Text Edit Modal -->
        <div id="edit-modal" class="modal-overlay hidden">
            <div class="modal-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h4 id="edit-title" style="margin: 0; font-size: 0.95rem;">Edit Content</h4>
                    <button id="close-edit-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <textarea id="edit-textarea" class="form-input" style="min-height: 220px; font-family: monospace; font-size: 0.8rem; padding: 10px; margin-bottom: 10px;"></textarea>
                <button id="save-edit-btn" class="btn btn-primary btn-sm" style="width: 100%;"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
            </div>
        </div>

        <!-- Rename Modal -->
        <div id="rename-modal" class="modal-overlay hidden">
            <div class="modal-card" style="max-width: 360px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h4 style="margin: 0; font-size: 0.95rem;">Rename File</h4>
                    <button id="close-rename-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <p id="rename-current-name" style="font-weight: 700; font-size: 0.82rem; margin-bottom: 10px; word-break: break-all;"></p>
                <div class="form-group">
                    <label class="form-label" style="font-size: 0.8rem;">New Name:</label>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <input type="text" id="rename-input" class="form-input" style="flex: 1; font-size: 0.85rem;" placeholder="New name">
                        <span id="rename-extension" style="font-weight: 700; color: var(--text-secondary); font-size: 0.85rem;">.ext</span>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <button id="cancel-rename-btn" class="btn btn-secondary btn-sm">Cancel</button>
                    <button id="save-rename-btn" class="btn btn-primary btn-sm"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div id="delete-confirm-modal" class="modal-overlay hidden">
            <div class="modal-card" style="max-width: 360px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h4 style="margin: 0; font-size: 0.95rem; color: var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i> Delete File?</h4>
                    <button id="close-delete-confirm-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <p id="delete-confirm-msg" style="font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 14px; line-height: 1.5;"></p>
                <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <button id="cancel-delete-confirm-btn" class="btn btn-secondary btn-sm">Cancel</button>
                    <button id="exec-delete-confirm-btn" class="btn btn-primary btn-sm" style="background: var(--danger); border-color: var(--danger);"><i class="fa-solid fa-trash-can"></i> Permanently Delete</button>
                </div>
            </div>
        </div>

        <!-- File Properties / Metadata Modal -->
        <div id="properties-modal" class="modal-overlay hidden">
            <div class="modal-card" style="max-width: 380px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h4 style="margin: 0; font-size: 0.95rem; color: var(--cyan-neon);"><i class="fa-solid fa-circle-info"></i> File Properties</h4>
                    <button id="close-properties-btn" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="properties-body" style="font-size: 0.8rem; display: flex; flex-direction: column; gap: 8px;"></div>
                <div style="display: flex; gap: 8px; margin-top: 14px;">
                    <button id="btn-prop-share" class="btn btn-secondary btn-sm" style="flex: 1;"><i class="fa-solid fa-share-nodes"></i> Share</button>
                    <button id="btn-prop-local-save" class="btn btn-primary btn-sm" style="flex: 1;"><i class="fa-solid fa-download"></i> Save to Device</button>
                </div>
            </div>
        </div>

        <!-- Mobile Bottom Tab Navigation -->
        <nav class="bottom-nav-bar">
            <a href="dashboard.html" class="bottom-nav-item">
                <i class="fa-solid fa-gauge"></i>
                <span>Home</span>
            </a>
            <a href="tools.html" class="bottom-nav-item">
                <i class="fa-solid fa-grid-2"></i>
                <span>Tools</span>
            </a>
            <a href="convert.html" class="bottom-nav-item">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Convert</span>
            </a>
            <a href="files.html" class="bottom-nav-item active">
                <i class="fa-solid fa-folder-open"></i>
                <span>Files</span>
            </a>
            <a href="history.html" class="bottom-nav-item">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>History</span>
            </a>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/universalRegistry.js"></script>
    <script src="js/futuristicEngine.js"></script>
    <script src="js/files.js"></script>
</body>
</html>
