<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Docholder â€” Transformation History</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mobile-app-shell">
        <div class="mobile-status-bar">
            <span class="status-bar-time">9:41</span>
            <div class="dynamic-island-notch">
                <div class="notch-camera-dot"></div>
            </div>
            <div class="status-bar-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <header class="mobile-app-header">
            <button class="mobile-header-btn" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="mobile-header-title">
                <span>Activity History</span>
            </div>
            <button id="btn-refresh-history" class="icon-btn" title="Refresh"><i class="fa-solid fa-rotate-right"></i></button>
        </header>

        <span id="nav-user-email" class="hidden"></span>

        <main class="app-body">
            <div class="page-title-block">
                <h1 class="page-title"><i class="fa-solid fa-clock-rotate-left" style="color: var(--primary);"></i> History & Activity</h1>
                <p class="page-subtitle">Track and re-download all your processed files.</p>
            </div>

            <!-- Search History -->
            <div class="search-bar" style="margin-bottom: 12px;">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="history-search-input" class="search-input" placeholder="Search transformations...">
            </div>

            <!-- History List Container -->
            <div id="history-items-list" style="display: flex; flex-direction: column; gap: 10px;">
                <div style="text-align: center; color: var(--text-secondary); padding: 30px;">Loading history...</div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav-bar">
            <a href="dashboard.html" class="bottom-nav-item">
                <i class="fa-solid fa-gauge"></i>
                <span>Home</span>
            </a>
            <a href="tools.html" class="bottom-nav-item">
                <i class="fa-solid fa-grid-2"></i>
                <span>Tools</span>
            </a>
            <a href="convert.html" class="bottom-nav-item">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Convert</span>
            </a>
            <a href="files.html" class="bottom-nav-item">
                <i class="fa-solid fa-folder-open"></i>
                <span>Files</span>
            </a>
            <a href="history.html" class="bottom-nav-item active">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>History</span>
            </a>
        </nav>
    </div>

    <script src="js/authGuard.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/universalRegistry.js"></script>
    <script src="js/futuristicEngine.js"></script>
    <script src="js/history.js"></script>
</body>
</html>
