<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Docholder — Edit Word & Document</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        (function() {
            const t = localStorage.getItem('docholder_theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <style>
        .brand-doc-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: var(--surface-hover);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-full);
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text);
            max-width: 420px;
            box-shadow: var(--card-shadow);
        }
        .brand-doc-pill span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .editor-tool-btn {
            padding: 5px 12px;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="app-navbar">
            <div class="navbar-inner">
                <a href="files.html" class="brand-wrapper">
                    <img src="assets/logo.svg" alt="Docholder" class="brand-logo">
                    <span class="brand-title">Docholder</span>
                </a>
                <div class="brand-doc-pill">
                    <i class="fa-solid fa-file-word" style="color: #3B82F6; font-size: 1rem;"></i>
                    <span id="docx-filename">Loading Document...</span>
                </div>
                <div class="nav-actions" style="display: flex; gap: 8px; align-items: center;">
                    <button class="theme-toggle-btn" onclick="toggleTheme()" style="width: 34px; height: 34px; font-size: 0.85rem;" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
                    <a href="files.html" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> Back to Files</a>
                    <button class="btn btn-primary btn-sm" id="save-docx-btn"><i class="fa-solid fa-floppy-disk"></i> Save DOCX</button>
                </div>
            </div>
        </header>

        <main class="main-container">
            <!-- Document Toolbar & Utilities Card -->
            <div class="editor-toolbar-card cyber-card">
                <div class="editor-tool-group">
                    <button type="button" id="btn-toggle-find" class="btn btn-secondary btn-sm editor-tool-btn"><i class="fa-solid fa-magnifying-glass"></i> Find & Replace</button>
                    <button type="button" id="btn-export-pdf" class="btn btn-secondary btn-sm editor-tool-btn"><i class="fa-solid fa-file-pdf" style="color: #EF4444;"></i> Export PDF</button>
                    <button type="button" id="btn-export-txt" class="btn btn-secondary btn-sm editor-tool-btn"><i class="fa-solid fa-file-lines" style="color: #64748B;"></i> Export TXT</button>
                </div>

                <div>
                    <span class="hud-badge hud-badge-cyan" id="docx-stats-badge" style="font-size: 0.74rem;">
                        <i class="fa-solid fa-align-left"></i> 0 blocks • 0 words
                    </span>
                </div>

                <!-- Find and Replace Slide-down Bar -->
                <div id="find-replace-bar" class="editor-search-banner hidden">
                    <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: center;">
                        <div style="position: relative;">
                            <input type="text" id="find-query" class="form-input" placeholder="Find text in document..." style="font-size: 0.84rem; padding: 6px 10px;">
                        </div>
                        <div style="position: relative;">
                            <input type="text" id="replace-query" class="form-input" placeholder="Replace with..." style="font-size: 0.84rem; padding: 6px 10px;">
                        </div>
                        <div style="display: flex; gap: 6px;">
                            <button type="button" id="btn-exec-replace" class="btn btn-primary btn-sm" style="font-size: 0.8rem; padding: 6px 14px;"><i class="fa-solid fa-repeat"></i> Replace All</button>
                            <button type="button" id="btn-close-find" class="icon-btn" style="width: 32px; height: 32px;" title="Close Search"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Text Content Stage Card -->
            <div class="glass-card cyber-card" style="padding: 20px;">
                <div class="card-inner-box" style="margin-bottom: 16px; display: flex; align-items: center; gap: 12px;">
                    <i class="fa-solid fa-circle-info" style="color: var(--cyan-neon); font-size: 1.15rem; flex-shrink: 0;"></i>
                    <span style="font-size: 0.84rem; color: var(--text-secondary); line-height: 1.5;">
                        Edit text segments below. Original document typography hierarchy, tables, layouts, headers, and styles will be strictly preserved upon saving.
                    </span>
                </div>

                <div id="blocks-container">
                    <div style="text-align: center; padding: 48px; color: var(--text-secondary);">
                        <i class="fa-solid fa-spinner fa-spin fa-2x" style="color: var(--cyan-neon); margin-bottom: 12px;"></i>
                        <p style="font-size: 0.9rem; font-family: var(--font-hud);">Extracting document text segments...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/authGuard.js"></script>
    <script src="js/pageTransition.js"></script>
    <script src="js/api.js"></script>
    <script src="js/docx-editor.js"></script>
</body>
</html>
