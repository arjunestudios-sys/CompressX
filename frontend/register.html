<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Docholder — Create Account</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mobile-app-shell">
        <div class="mobile-status-bar">
            <span class="status-bar-time">9:41</span>
            <div class="dynamic-island-notch">
                <div class="notch-camera-dot"></div>
            </div>
            <div class="status-bar-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <header class="mobile-app-header">
            <button class="mobile-header-btn" onclick="window.location.href='login.html'"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="mobile-header-title">
                <span>Create Account</span>
            </div>
            <a href="login.html" class="mobile-header-btn"><i class="fa-solid fa-right-to-bracket"></i></a>
        </header>

        <main class="app-body">
            <div class="glass-card" style="padding: 24px 16px;">
                <div style="text-align: center; margin-bottom: 20px;">
                    <img src="assets/logo.svg" alt="Docholder" style="width: 50px; height: 50px; margin-bottom: 8px;">
                    <h2 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 2px;">Join Docholder</h2>
                    <p style="font-size: 0.8rem; color: var(--text-secondary);">Start transforming your documents.</p>
                </div>

                <form id="register-form">
                    <div class="form-group">
                        <label class="form-label" for="reg-name" style="font-size: 0.8rem;">Full Name</label>
                        <input type="text" id="reg-name" class="form-input" placeholder="Alex Rivera" required style="font-size: 0.85rem;">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-email" style="font-size: 0.8rem;">Email Address</label>
                        <input type="email" id="reg-email" class="form-input" placeholder="alex@domain.com" required style="font-size: 0.85rem;">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-password" style="font-size: 0.8rem;">Password (≥6 chars)</label>
                        <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required style="font-size: 0.85rem;">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reg-confirm" style="font-size: 0.8rem;">Confirm Password</label>
                        <input type="password" id="reg-confirm" class="form-input" placeholder="••••••••" required style="font-size: 0.85rem;">
                    </div>

                    <div id="register-error" class="form-error" style="margin-bottom: 12px; color: var(--danger); font-size: 0.8rem;"></div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;"><i class="fa-solid fa-user-plus"></i> Create Account</button>
                </form>

                <div style="margin-top: 16px; text-align: center; color: var(--text-secondary); font-size: 0.82rem;">
                    Already registered? <a href="login.html" style="font-weight: 700;">Sign in</a>
                </div>

                <div style="margin-top: 16px; border-top: 1px solid var(--surface-border); padding-top: 16px;">
                    <a href="/api/auth/google" class="btn btn-google btn-sm" style="width: 100%; padding: 8px;">
                        <i class="fa-brands fa-google" style="color: #ea4335;"></i> Continue with Google
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/futuristicEngine.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
