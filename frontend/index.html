<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Docholder — Loading</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }

        /* â”€â”€ Full-Screen Splash â”€â”€ */
        .splash-screen {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: var(--bg);
            z-index: 9999; overflow: hidden;
        }

        /* â”€â”€ Gradient Orbs â”€â”€ */
        .splash-orb {
            position: absolute; border-radius: 50%;
            filter: blur(64px); pointer-events: none;
            animation: orbPulse 4s ease-in-out infinite;
        }
        .orb1 { width:300px;height:300px; background:radial-gradient(circle,rgba(79,70,229,.32) 0%,transparent 70%); top:-100px;left:-80px; animation-delay:0s; }
        .orb2 { width:240px;height:240px; background:radial-gradient(circle,rgba(2,132,199,.26) 0%,transparent 70%); bottom:-80px;right:-60px; animation-delay:1.6s; }
        .orb3 { width:180px;height:180px; background:radial-gradient(circle,rgba(192,38,211,.16) 0%,transparent 70%); top:38%;left:-40px; animation-delay:0.9s; }

        /* â”€â”€ Floating Particles â”€â”€ */
        .splash-particles { position:absolute;inset:0;pointer-events:none;overflow:hidden; }
        .particle { position:absolute;border-radius:50%;opacity:0;animation:particleFloat linear infinite; }

        /* â”€â”€ Center Content â”€â”€ */
        .splash-content {
            position:relative; z-index:10;
            display:flex;flex-direction:column;
            align-items:center;text-align:center;
            padding:0 24px;
        }

        /* â”€â”€ Logo â”€â”€ */
        .logo-wrap {
            position:relative; width:104px; height:104px;
            margin-bottom:22px;
            opacity:0; transform:scale(0.55) translateY(28px);
            animation:logoIn 0.95s cubic-bezier(.16,1,.3,1) 0.1s forwards;
            display:flex; align-items:center; justify-content:center;
            border-radius:50%;
        }
        .ring1, .ring2 {
            position:absolute; border-radius:50%;
            border:1.5px solid transparent;
        }
        .ring1 {
            inset:-8px;
            background:linear-gradient(var(--bg),var(--bg)) padding-box,
                        conic-gradient(from 0deg,#4F46E5,#0284C7,#C026D3,#4F46E5) border-box;
            animation:spin 3s linear infinite;
        }
        .ring2 {
            inset:-16px;
            border-width:1px;
            background:linear-gradient(var(--bg),var(--bg)) padding-box,
                        conic-gradient(from 180deg,rgba(79,70,229,.4),transparent,rgba(2,132,199,.4)) border-box;
            animation:spin 5.5s linear infinite reverse;
        }
        .logo-img {
            width:100%;height:100%;position:relative;z-index:1;
            border-radius:50%;
            overflow:hidden;
            object-fit:cover;
            filter:drop-shadow(0 8px 24px rgba(79,70,229,.4));
            animation:logoPulse 2.8s ease-in-out infinite 1.2s;
        }

        /* â”€â”€ Text â”€â”€ */
        .splash-name {
            font-family:'Space Grotesk',sans-serif;
            font-size:2rem; font-weight:800; letter-spacing:-.5px;
            background:linear-gradient(135deg,#4F46E5 0%,#0284C7 55%,#6366F1 100%);
            -webkit-background-clip:text; background-clip:text;
            -webkit-text-fill-color:transparent;
            opacity:0; transform:translateY(16px);
            animation:fadeUp .8s cubic-bezier(.16,1,.3,1) .6s forwards;
            margin-bottom:6px;
        }
        .splash-tag {
            font-family:'Space Grotesk',sans-serif;
            font-size:.82rem; font-weight:500; color:var(--text-secondary);
            opacity:0; transform:translateY(12px);
            animation:fadeUp .8s cubic-bezier(.16,1,.3,1) .85s forwards;
            margin-bottom:28px;
        }

        /* â”€â”€ Pills â”€â”€ */
        .splash-pills {
            display:flex; gap:6px; flex-wrap:wrap; justify-content:center;
            margin-bottom:28px;
            opacity:0; animation:fadeIn .6s ease 1.1s forwards;
        }
        .pill {
            display:inline-flex;align-items:center;gap:4px;
            padding:4px 10px; border-radius:999px;
            font-size:.68rem;font-weight:600;
            font-family:'Space Grotesk',sans-serif;
            letter-spacing:.3px;border:1px solid;
        }
        .pill-ai   { background:rgba(79,70,229,.1); color:#4F46E5; border-color:rgba(79,70,229,.25); }
        .pill-tool { background:rgba(2,132,199,.1); color:#0284C7; border-color:rgba(2,132,199,.25); }
        .pill-priv { background:rgba(5,150,105,.1); color:#059669; border-color:rgba(5,150,105,.25); }

        /* â”€â”€ Progress â”€â”€ */
        .progress-wrap {
            width:160px;
            opacity:0; animation:fadeIn .5s ease 1.05s forwards;
        }
        .progress-track {
            width:100%;height:3px;
            background:var(--surface-border);border-radius:99px;overflow:hidden;
            margin-bottom:10px;
        }
        .progress-fill {
            height:100%;width:0%;border-radius:99px;
            background:linear-gradient(90deg,#4F46E5,#0284C7,#6366F1);
            box-shadow:0 0 8px rgba(79,70,229,.5);
            transition:width .35s cubic-bezier(.4,0,.2,1);
        }
        .progress-label {
            font-family:'Space Grotesk',monospace;
            font-size:.63rem;font-weight:500;letter-spacing:.8px;
            color:var(--text-muted);text-transform:uppercase;text-align:center;
        }

        /* â”€â”€ Footer â”€â”€ */
        .splash-footer {
            position:absolute;bottom:20px;
            font-family:'Space Grotesk',sans-serif;
            font-size:.63rem;color:var(--text-muted);letter-spacing:.5px;
            opacity:0;animation:fadeIn .6s ease 1.5s forwards;
        }
        .splash-footer b { color:var(--primary);font-weight:700; }

        /* â”€â”€ Dark Mode â”€â”€ */
        [data-theme="dark"] .orb1 { background:radial-gradient(circle,rgba(99,102,241,.42) 0%,transparent 70%); }
        [data-theme="dark"] .orb2 { background:radial-gradient(circle,rgba(0,240,255,.28) 0%,transparent 70%); }
        [data-theme="dark"] .orb3 { background:radial-gradient(circle,rgba(255,0,122,.18) 0%,transparent 70%); }
        [data-theme="dark"] .ring1 {
            background:linear-gradient(var(--bg),var(--bg)) padding-box,
                        conic-gradient(from 0deg,#6366F1,#00F0FF,#FF007A,#6366F1) border-box;
        }
        [data-theme="dark"] .ring2 {
            background:linear-gradient(var(--bg),var(--bg)) padding-box,
                        conic-gradient(from 180deg,rgba(99,102,241,.5),transparent,rgba(0,240,255,.5)) border-box;
        }
        [data-theme="dark"] .splash-name {
            background:linear-gradient(135deg,#818CF8 0%,#22D3EE 55%,#A78BFA 100%);
            -webkit-background-clip:text;background-clip:text;
        }
        [data-theme="dark"] .pill-ai   { background:rgba(99,102,241,.18);color:#818CF8;border-color:rgba(99,102,241,.35); }
        [data-theme="dark"] .pill-tool { background:rgba(0,240,255,.12);color:#22D3EE;border-color:rgba(0,240,255,.28); }
        [data-theme="dark"] .pill-priv { background:rgba(16,185,129,.14);color:#10B981;border-color:rgba(16,185,129,.3); }
        [data-theme="dark"] .progress-fill {
            background:linear-gradient(90deg,#6366F1,#00F0FF,#A78BFA);
            box-shadow:0 0 14px rgba(99,102,241,.7);
        }
        [data-theme="dark"] .logo-img { filter:drop-shadow(0 8px 24px rgba(99,102,241,.55)); }

        /* â”€â”€ Exit â”€â”€ */
        .splash-screen.exit { animation:splashExit .38s cubic-bezier(.4,0,1,1) forwards; }

        /* â”€â”€ Keyframes â”€â”€ */
        @keyframes logoIn   { to { opacity:1;transform:scale(1) translateY(0); } }
        @keyframes logoPulse {
            0%,100% { filter:drop-shadow(0 8px 20px rgba(79,70,229,.4));transform:translateY(0); }
            50%     { filter:drop-shadow(0 14px 30px rgba(2,132,199,.5));transform:translateY(-5px); }
        }
        @keyframes spin         { to { transform:rotate(360deg); } }
        @keyframes orbPulse     { 0%,100%{opacity:.7;transform:scale(1);} 50%{opacity:1;transform:scale(1.12);} }
        @keyframes fadeUp       { to { opacity:1;transform:translateY(0); } }
        @keyframes fadeIn       { to { opacity:1; } }
        @keyframes particleFloat {
            0%   { transform:translateY(110vh) scale(0);opacity:0; }
            10%  { opacity:.9; }
            90%  { opacity:.5; }
            100% { transform:translateY(-10vh) scale(1);opacity:0; }
        }
        @keyframes splashExit { 0%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(1.05);} }
    </style>
</head>
<body>
<div id="splash" class="splash-screen">

    <!-- Ambient orbs -->
    <div class="splash-orb orb1"></div>
    <div class="splash-orb orb2"></div>
    <div class="splash-orb orb3"></div>

    <!-- Particles container -->
    <div class="splash-particles" id="particles"></div>

    <!-- Main -->
    <div class="splash-content">

        <!-- Logo -->
        <div class="logo-wrap">
            <div class="ring2"></div>
            <div class="ring1"></div>
            <img class="logo-img" src="assets/logo-circle.png" alt="Docholder"
                 onerror="this.onerror=null;this.src='assets/logo.png'">
        </div>

        <h1 class="splash-name">Docholder</h1>
        <p class="splash-tag">Universal AI File Intelligence Platform</p>

        <div class="splash-pills">
            <span class="pill pill-ai">âœ¦ AI-Powered</span>
            <span class="pill pill-tool">âš¡ 50+ Tools</span>
            <span class="pill pill-priv">â¬¡ Private &amp; Local</span>
        </div>

        <div class="progress-wrap">
            <div class="progress-track">
                <div class="progress-fill" id="prog"></div>
            </div>
            <div class="progress-label" id="prog-label">Initializing...</div>
        </div>
    </div>

    <div class="splash-footer">Powered by <b>Docholder AI</b></div>
</div>

<script src="js/api.js"></script>
<script>
    // Apply saved theme immediately
    (function(){
        const t = localStorage.getItem('docholder_theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
    })();

    // Generate floating particles
    (function(){
        const c = document.getElementById('particles');
        const cols = ['#4F46E5','#0284C7','#6366F1','#C026D3','#059669','#38BDF8'];
        for(let i = 0; i < 20; i++){
            const p = document.createElement('div');
            p.className = 'particle';
            const sz  = Math.random() * 5 + 2.5;
            const dur = Math.random() * 9 + 7;
            const del = Math.random() * 8;
            p.style.cssText = `
                width:${sz}px;height:${sz}px;
                left:${Math.random()*100}%;
                background:${cols[Math.floor(Math.random()*cols.length)]};
                animation-duration:${dur}s;
                animation-delay:${del}s;
            `;
            c.appendChild(p);
        }
    })();

    // Boot sequence
    const prog  = document.getElementById('prog');
    const label = document.getElementById('prog-label');
    const splash = document.getElementById('splash');

    function setProgress(pct, text){
        if(prog)  prog.style.width = pct + '%';
        if(label) label.textContent = text;
    }

    async function boot(){
        setProgress(12, 'Loading workspace...');
        await new Promise(r => setTimeout(r, 60));

        setProgress(35, 'Verifying session...');

        let route = 'dashboard.html';
        const authP = (typeof apiFetch === 'function'
            ? apiFetch('/api/auth/me')
            : Promise.reject()
        ).then(res => {
            if(res && res.user){
                try{ sessionStorage.setItem('docholder_cached_user', JSON.stringify(res.user)); }catch(e){}
            }
        }).catch(() => {});

        // Allow max 400ms for auth
        await Promise.race([authP, new Promise(r => setTimeout(r, 400))]);

        setProgress(60, 'Syncing file registry...');
        await new Promise(r => setTimeout(r, 80));

        setProgress(80, 'Preparing AI engines...');
        await new Promise(r => setTimeout(r, 80));

        setProgress(95, 'Almost ready...');
        await authP; // ensure resolved

        setProgress(100, 'Launching!');
        await new Promise(r => setTimeout(r, 200));

        splash.classList.add('exit');
        setTimeout(() => window.location.replace(route), 360);
    }

    document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
