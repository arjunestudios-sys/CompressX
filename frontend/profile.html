<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Docholder — Profile</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="mobile-app-shell">
        <div class="mobile-status-bar">
            <span class="status-bar-time">9:41</span>
            <div class="dynamic-island-notch">
                <div class="notch-camera-dot"></div>
            </div>
            <div class="status-bar-icons">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <header class="mobile-app-header">
            <button class="mobile-header-btn" onclick="window.location.href='dashboard.html'"><i class="fa-solid fa-arrow-left"></i></button>
            <div class="mobile-header-title">
                <span>Profile</span>
            </div>
            <button class="theme-toggle-btn" onclick="toggleTheme()" style="width: 32px; height: 32px; font-size: 0.85rem;" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
        </header>

        <span id="nav-user-email" class="hidden"></span>

        <main class="app-body">
            <div class="page-title-block">
                <h1 class="page-title"><i class="fa-solid fa-user-gear" style="color: var(--primary);"></i> Account</h1>
                <p class="page-subtitle">Manage your mobile profile and security.</p>
            </div>

            <div class="glass-card" style="padding: 20px 14px;">
                <div id="prof-avatar-box" style="margin: 0 auto 16px auto; width: 68px; height: 68px;"></div>
                
                <form id="profile-form">
                    <div class="form-group">
                        <label class="form-label" style="font-size: 0.8rem;">Display Name</label>
                        <input type="text" id="prof-name" class="form-input" style="font-size: 0.85rem;">
                    </div>

                    <div class="form-group">
                        <label class="form-label" style="font-size: 0.8rem;">Email (Read-Only)</label>
                        <input type="email" id="prof-email" class="form-input" readonly style="background: var(--surface-hover); cursor: not-allowed; font-size: 0.85rem;">
                    </div>

                    <div class="mobile-row-grid" style="margin: 14px 0;">
                        <div class="stat-card" style="padding: 8px 10px;">
                            <div>
                                <div style="font-size: 0.72rem; color: var(--text-secondary);">Account</div>
                                <strong id="prof-auth-type" style="color: var(--primary); font-size: 0.82rem;">Docholder</strong>
                            </div>
                        </div>
                        <div class="stat-card" style="padding: 8px 10px;">
                            <div>
                                <div style="font-size: 0.72rem; color: var(--text-secondary);">Member</div>
                                <strong id="prof-created" style="font-size: 0.82rem;">Active</strong>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
                        <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-floppy-disk"></i> Save Profile</button>
                        <button type="button" onclick="handleLogout()" class="btn btn-danger btn-sm">
                            <i class="fa-solid fa-right-from-bracket"></i> Sign Out
                        </button>
                    </div>
                </form>
            </div>
        </main>

        <nav class="bottom-nav-bar">
            <a href="dashboard.html" class="bottom-nav-item">
                <i class="fa-solid fa-gauge"></i>
                <span>Home</span>
            </a>
            <a href="convert.html" class="bottom-nav-item">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Transform</span>
            </a>
            <a href="files.html" class="bottom-nav-item">
                <i class="fa-solid fa-folder-open"></i>
                <span>Files</span>
            </a>
            <a href="compress.html" class="bottom-nav-item">
                <i class="fa-solid fa-file-zipper"></i>
                <span>Compress</span>
            </a>
            <a href="settings.html" class="bottom-nav-item">
                <i class="fa-solid fa-sliders"></i>
                <span>Settings</span>
            </a>
        </nav>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/futuristicEngine.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
